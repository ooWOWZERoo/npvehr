[pytest]
testpaths = tests
# CI invokes bare `pytest` (not `python -m pytest`), which does not put the
# repo root on sys.path -- without this, tests/test_ap_composer.py's
# `from ehr.services.ap_composer import ...` fails with
# ModuleNotFoundError: No module named 'ehr' (tests/ has no __init__.py, so
# pytest's default import mode only prepends tests/ itself, not the repo
# root). `python -m pytest` masks this locally since `-m` already prepends
# cwd. pythonpath is a built-in pytest option (core since 7.0) for exactly
# this.
pythonpath = .
