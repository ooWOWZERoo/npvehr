<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ request.state.csrf_token }}">
  <script>
    /* Apply the saved theme before first paint (shared with the staff app; key set by the toggle). */
    try { if (localStorage.getItem("npv-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
  </script>
  <title>{% block title %}Patient Portal &mdash; New Path Vision EHR{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body.portal-body { background: radial-gradient(1000px 500px at 10% -10%, var(--primary-soft), transparent 60%), var(--canvas); min-height: 100vh; }
    .portal-topbar {
      display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap;
      padding: var(--space-3) var(--space-6); background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .portal-brand { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; color: var(--ink-strong); }
    .portal-nav { display: flex; gap: var(--space-1); align-items: center; font-size: 0.85rem; flex-wrap: wrap; }
    .portal-nav a { padding: 0.4rem 0.8rem; border-radius: 999px; color: var(--ink-strong); font-weight: 500; }
    .portal-nav a:hover { background: var(--primary-soft); text-decoration: none; }
    .portal-nav a.active { background: var(--primary-soft); font-weight: 700; box-shadow: inset 0 0 0 1px var(--primary); }
    .portal-nav form { margin: 0 0 0 var(--space-2); }
    .portal-nav .theme-toggle { border-color: var(--border); background: var(--surface-sunken); color: var(--ink-strong); margin-left: var(--space-2); }
    .portal-nav .theme-toggle:hover { background: var(--primary-soft); }
    .portal-main { max-width: 760px; margin: 0 auto; padding: var(--space-6); }
    @media (max-width: 600px) { .portal-topbar { padding: var(--space-3) var(--space-4); } .portal-main { padding: var(--space-4); } }
  </style>
</head>
<body class="portal-body">
  <div class="portal-topbar">
    <span class="portal-brand">New Path Vision &mdash; Patient Portal</span>
    {% set _p = request.url.path %}
    <nav class="portal-nav" aria-label="Patient portal">
      <a href="/portal/" class="{{ 'active' if _p.rstrip('/') == '/portal' }}">Home</a>
      <a href="/portal/appointments" class="{{ 'active' if _p.startswith('/portal/appointments') or _p.startswith('/portal/book') or _p.startswith('/portal/reschedule') }}">Appointments</a>
      <a href="/portal/waitlist" class="{{ 'active' if _p.startswith('/portal/waitlist') }}">Waitlist</a>
      <a href="/portal/records" class="{{ 'active' if _p.startswith('/portal/records') }}">My Records</a>
      <button type="button" class="theme-toggle" id="themeToggle" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme">
        <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <form method="post" action="/portal/logout">
        <button type="submit" class="btn btn-secondary btn-sm">Sign Out</button>
      </form>
    </nav>
  </div>
  <div class="portal-main">
    {% block portal_content %}{% endblock %}
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
