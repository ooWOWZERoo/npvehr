<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Portal Sign In &mdash; New Path Vision EHR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body.login-body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(160deg, var(--primary-strong), var(--primary) 60%, var(--primary-soft));
    }
    .login-card {
      background: var(--surface); border-radius: 14px; box-shadow: 0 20px 50px rgba(19,36,32,0.25);
      padding: var(--space-7) var(--space-6); width: 100%; max-width: 380px;
    }
    .login-brand-text { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; color: var(--primary-strong); margin-bottom: var(--space-6); display: block; }
    .login-card h1 { font-size: 1.3rem; margin-bottom: var(--space-2); }
    .login-card p.login-sub { color: var(--ink-muted); margin: 0 0 var(--space-5); font-size: 0.85rem; }
    .login-card .btn-primary { width: 100%; justify-content: center; padding: 0.6rem; font-size: 0.9rem; }
    .login-footnote { margin-top: var(--space-5); font-size: 0.75rem; color: var(--ink-muted); text-align: center; }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <span class="login-brand-text">New Path Vision &mdash; Patient Portal</span>
    <h1>Sign in</h1>
    <p class="login-sub">Enter the email on file with your provider. We'll send you a one-time sign-in link &mdash; no password needed.</p>
    {% if error %}
    <div class="alert alert-error" style="margin-bottom: var(--space-4)">{{ error }}</div>
    {% endif %}
    <form method="post" action="/portal/login">
      <input type="hidden" name="csrf_token" value="{{ login_csrf_token }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary">Send Sign-In Link</button>
    </form>
    <p class="login-footnote">Are you a staff member? <a href="/login">Sign in here</a> instead.</p>
  </div>
</body>
</html>
