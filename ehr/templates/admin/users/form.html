{% extends "base.html" %}
{% block title %}New User &mdash; New Path Vision EHR{% endblock %}
{% block content %}
<h1>New User Account</h1>
{% if error %}<div class="alert alert-error" style="margin-bottom:var(--space-4)">{{ error }}</div>{% endif %}
<div class="card" style="max-width:480px">
  <form method="post" action="/admin/users/new">
    <div class="form-group"><label for="first_name">First Name</label><input type="text" id="first_name" name="first_name" required></div>
    <div class="form-group"><label for="last_name">Last Name</label><input type="text" id="last_name" name="last_name" required></div>
    <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" name="role" required>
        {% for r in roles %}<option value="{{ r }}">{{ ROLE_LABELS.get(r, r) }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="password">Initial Password</label>
      <input type="password" id="password" name="password" required minlength="10">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create User</button>
      <a href="/admin/users" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
