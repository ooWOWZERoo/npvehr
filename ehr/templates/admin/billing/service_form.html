{% extends "base.html" %}
{% block title %}Edit Service &mdash; Admin{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit Service: {{ service.name }}</h1>
  <a href="/admin/billing/services" class="btn btn-secondary">Cancel</a></div>
<div class="card form-card">
  {% if error %}<div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/billing/services/{{ service.id }}/edit">
    <div class="form-row cols-4">
      <div class="form-group"><label>Code* <input name="code" required value="{{ service.code }}"></label></div>
      <div class="form-group"><label>Name* <input name="name" required value="{{ service.name }}"></label></div>
      <div class="form-group"><label>Category* <input name="category" required value="{{ service.category }}"></label></div>
      <div class="form-group"><label>CPT Code <input name="cpt_code" value="{{ service.cpt_code or '' }}"></label></div>
    </div>
    <div class="form-row cols-4">
      <div class="form-group"><label>Fee ($)* <input name="fee" type="number" step="0.01" min="0" required value="{{ '%.2f'|format(service.fee) }}"></label></div>
    </div>
    <p style="font-size:0.8rem;color:var(--ink-muted)">
      Active/inactive status is managed from the <a href="/admin/billing/services">Service &amp; Fee Catalog list</a>,
      not part of this form.
    </p>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save Changes</button></div>
  </form>
</div>
{% endblock %}
