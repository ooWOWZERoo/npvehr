{% extends "base.html" %}
{% block title %}Edit ROS Prompt &mdash; Admin{% endblock %}
{% block content %}
<div class="page-header"><div><span class="page-eyebrow">Administration</span><h1>Edit ROS Prompt</h1></div>
  <a href="/admin/ros" class="btn btn-secondary">Cancel</a></div>
<div class="card form-card">
  {% if error %}<div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/ros/items/{{ item.id }}/edit">
    <div class="form-row cols-3">
      <div class="form-group"><label>Body System* <select name="body_system" required>{% for s in systems %}<option {{ 'selected' if s == item.body_system }}>{{ s }}</option>{% endfor %}</select></label></div>
      <div class="form-group"><label>Prompt* <input name="prompt_text" required maxlength="255" value="{{ item.prompt_text }}"></label></div>
      <div class="form-group"><label>Sort Order <input name="sort_order" type="number" value="{{ item.sort_order or 0 }}"></label></div>
    </div>
    <p style="font-size:0.8rem;color:var(--ink-muted)">Active/inactive is managed from the <a href="/admin/ros">ROS Catalog list</a>.</p>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save Changes</button></div>
  </form>
</div>
{% endblock %}
