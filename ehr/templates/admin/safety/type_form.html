{% extends "base.html" %}
{% block title %}Edit Safety Flag &mdash; Admin{% endblock %}
{% block content %}
<div class="page-header"><div><span class="page-eyebrow">Administration</span><h1>Edit Flag: {{ t.label }}</h1></div><a href="/admin/safety" class="btn btn-secondary">Cancel</a></div>
<div class="card form-card">
  {% if error %}<div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/safety/flag-types/{{ t.id }}/edit">
    <div class="form-row cols-3">
      <div class="form-group"><label>Label* <input name="label" required maxlength="120" value="{{ t.label }}"></label></div>
      <div class="form-group"><label>Description <input name="description" maxlength="255" value="{{ t.description or '' }}"></label></div>
      <div class="form-group"><label>Sort order <input name="sort_order" type="number" value="{{ t.sort_order or 0 }}"></label></div>
    </div>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save Changes</button></div>
  </form>
</div>
{% endblock %}
