{% extends "base.html" %}
{% block title %}Edit Correction &mdash; Admin{% endblock %}
{% block content %}
<div class="page-header"><h1>Edit Correction</h1>
  <a href="/admin/voice-scribe/corrections" class="btn btn-secondary">Cancel</a></div>
<div class="card form-card">
  {% if error %}<div class="alert alert-error" style="margin-bottom:1rem">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/voice-scribe/corrections/{{ correction.id }}/edit">
    <div class="form-row cols-4">
      <div class="form-group"><label>Mis-transcription* <input name="phrase" required value="{{ correction.phrase }}"></label></div>
      <div class="form-group"><label>Correct Spelling* <input name="correction" required value="{{ correction.correction }}"></label></div>
    </div>
    <p style="font-size:0.8rem;color:var(--ink-muted)">
      Active/inactive status is managed from the <a href="/admin/voice-scribe/corrections">Voice Scribe Vocabulary list</a>,
      not part of this form.
    </p>
    <div class="form-actions"><button type="submit" class="btn btn-primary">Save Changes</button></div>
  </form>
</div>
{% endblock %}
